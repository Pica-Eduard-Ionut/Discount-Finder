<!DOCTYPE html>
<html>
<head>
<title>Discount Finder</title>

<style>
* {
    box-sizing:border-box;
}

body {
    font-family:Arial, Helvetica, sans-serif;
    background:#17181c;
    color:#d6d8df;
    padding:30px;
}

.header {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}

h1 {
    color:#f1f3f5;
    font-weight:700;
}

.total {
    background:#22252b;
    padding:12px 20px;
    border-radius:14px;
    color:#9aa0aa;
    border:1px solid #30343c;
}

.total strong {
    color:#7dd3a8;
    font-size:22px;
}


.search {
    margin-bottom:30px;
}

input {
    width:400px;
    max-width:80%;
    padding:12px 15px;
    border-radius:12px;
    border:1px solid #343942;
    background:#202329;
    color:#e5e7eb;
    font-size:18px;
    outline:none;
}

input:focus {
    border-color:#6b8afd;
}


button {
    padding:12px 20px;
    border:none;
    border-radius:12px;
    background:#6b8afd;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

button:hover {
    background:#5874df;
}


.products {
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:22px;
}


.product-link {
    text-decoration:none;
    color:inherit;
    display:block;
}


.product {
    background:#202329;
    border-radius:18px;
    padding:20px;
    border:1px solid #30343c;
    transition:.25s;
    display:flex;
    flex-direction:column;
    height:100%;
    cursor:pointer;
}


.product:hover {
    transform:translateY(-5px);
    border-color:#6b8afd;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
}


.product img {
    width:100%;
    height:180px;
    object-fit:contain;
    background:#f5f5f5;
    border-radius:14px;
    margin-bottom:15px;
}


.product h2 {
    color:#f0f1f3;
    font-size:18px;
    min-height:45px;
    margin:5px 0 15px;
}


.supermarket {
    display:inline-block;
    width:fit-content;
    background:#3157a8;
    color:#e8edff;
    padding:6px 12px;
    border-radius:20px;
    font-size:14px;
    font-weight:bold;
}


.penny {
    background:#b83a45;
}


.price-box {
    margin-top:15px;
}


.old {
    text-decoration:line-through;
    color:#8b919c;
    font-size:16px;
}


.new {
    color:#7dd3a8;
    font-size:26px;
    font-weight:bold;
}


.discount {
    display:inline-block;
    margin-left:10px;
    background:#286b45;
    color:#d8ffe9;
    padding:6px 10px;
    border-radius:10px;
    font-weight:bold;
    font-size:14px;
}


.view-button {
    margin-top:20px;
    text-align:center;
    background:#3b4d8f;
    color:#eef2ff;
    padding:10px;
    border-radius:12px;
    font-weight:bold;
    transition:.2s;
}


.product-link:hover .view-button {
    background:#5269bd;
}


@media(max-width:600px) {

    body {
        padding:15px;
    }

    .header {
        flex-direction:column;
        align-items:flex-start;
        gap:15px;
    }

    input {
        width:100%;
        max-width:100%;
        margin-bottom:10px;
    }

}
</style>

</head>
<body>
<div class="header">
    <h1>🛒 Discount Finder</h1>

    <div class="total">
        Products tracked:
        <strong>{{total_products}}</strong>
    </div>
</div>

<form class="search">
    <input name="q" placeholder="Search product..." value="{{search}}">
    <button>Search</button>
</form>

<div class="products">

{% for p in products %}

<a class="product-link" href="{{p.url}}" target="_blank">

<div class="product">

    <img src="{{p.image if p.image else '/static/placeholder.webp'}}" alt="{{p.name}}">

    <h2>{{p.name}}</h2>

    <span class="supermarket {% if p.supermarket == 'Penny' %}penny{% endif %}">
        {{p.supermarket}}
    </span>

    <div class="price-box">

        {% if p.old_price %}
        <div class="old">
            {{p.old_price}} Lei
        </div>
        {% endif %}

        <span class="new">
            {{p.new_price}} Lei
        </span>

        {% if p.discount %}
        <span class="discount">
            -{{p.discount}}%
        </span>
        {% endif %}

    </div>

    <div class="view-button">
        View Product
    </div>

</div>

</a>

{% endfor %}

</div>

</body>
</html>
